services:
  postgres:
    image: postgres:16-alpine
    container_name: github-digest-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: github_digest
    ports:
      - "5432:5432"
    volumes:
      - digest_pg_data:/var/lib/postgresql/data

volumes:
  digest_pg_data: